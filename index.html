        else if (c && typeof c === 'object') { if(c.isBlocked === undefined) c.isBlocked = false; if(!c.group) c.group = '未分组'; APP_DATA.cards.push(c); }
    }
    var rawGroups = safeParseArray('app_groups', ['未分组']); APP_DATA.groups = [];

        if (typeof rawGroups[i] === 'string') APP_DATA.groups.push({ name: rawGroups[i], isBlocked: false });

function appendMsgUI(msg, index) {
    if (!msg || !msg.type) return;
    if (msg.type === 'system_call') {
        var sysDiv = document.createElement('div'); sysDiv.style.textAlign = 'center'; sysDiv.style.width = '100%'; sysDiv.style.margin = '10px 0';
        sysDiv.innerHTML = '<span style="background:#e6e6e6; color:#888; font-size:12px; padding:4px 10px; border-radius:4px;">' + msg.content + '</span>';
        document.getElementById('chatContainer').appendChild(sysDiv); return;
    }
    if (msg.type === 'pat') {
        var div = document.createElement('div'); div.className = 'pat-message';
        div.innerText = '✦ ' + (APP_DATA.settings.taName || '梦角') + ' ' + (msg.content || '') + ' ✦';
        document.getElementById('chatContainer').appendChild(div); return;
    }
    var isUser = msg.sender === 'user';
    var row = document.createElement('div'); row.className = 'message-row ' + msg.sender;
    var av = document.createElement('div'); av.className = 'avatar ' + msg.sender;
    var avImg = isUser ? APP_DATA.settings.userAvatar : APP_DATA.settings.taAvatar;
    var nameStr = isUser ? APP_DATA.settings.userName : APP_DATA.settings.taName;
    if (avImg) av.innerHTML = '<img src="' + avImg + '">'; else av.innerText = nameStr ? nameStr.charAt(0) : (isUser ? '我' : 'TA');

    var bubble = document.createElement('div');
    if (msg.type === 'image' && !msg.quote) {
        bubble.className = 'bubble only-image'; bubble.innerHTML = '<img src="' + msg.content + '">';
    } else if (msg.type === 'choice') {
        bubble.className = 'bubble choice-card';
        var h = '<div class="choice-header">' + (msg.title || '问卷') + '</div><div class="choice-body">';
        for (var i = 0; i < msg.questions.length; i++) {
            var q = msg.questions[i]; h += '<div class="choice-q-title">' + (i+1) + '. ' + q.q + '</div>';
            for (var j = 0; j < q.options.length; j++) h += '<div class="choice-opt">' + q.options[j] + '</div>';
            h += '<div style="height:10px;"></div>';
        }
        h += '</div>'; bubble.innerHTML = h;
    } else {
        bubble.className = 'bubble ' + msg.sender;
        var html = msg.quote ? '<div class="quote-box">' + msg.quote.senderName + '：' + (msg.quote.type === 'image' ? '[图片]' : msg.quote.text) + '</div>' : '';
        html += msg.type === 'image' ? '<img src="' + msg.content + '" style="max-width:80px; border-radius:4px;">' : '<span>' + (msg.text || '') + '</span>';
        bubble.innerHTML = html;
    }
    if (msg.type !== 'choice' && msg.type !== 'pat') {
        var timer = null;
        bubble.ontouchstart = function(e) { timer = setTimeout(function() { currentState.actionMsgIndex = index; document.getElementById('actionMenuOverlay').classList.add('active'); }, 500); };
        bubble.ontouchend = function() { clearTimeout(timer); };
        bubble.ontouchmove = function() { clearTimeout(timer); };
        bubble.onmousedown = function() { timer = setTimeout(function() { currentState.actionMsgIndex = index; document.getElementById('actionMenuOverlay').classList.add('active'); }, 500); };
        bubble.onmouseup = function() { clearTimeout(timer); };
    }
    row.appendChild(av); row.appendChild(bubble); document.getElementById('chatContainer').appendChild(row);
}window.checkSendBtn = function(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; document.getElementById('sendBtn').disabled = el.value.trim().length === 0; };

function getValidCards() {
    var valid = [];
    for (var i = 0; i < APP_DATA.cards.length; i++) {
        var card = APP_DATA.cards[i];
        if (card.isBlocked) continue;
        var gb = false;
        for (var j = 0; j < APP_DATA.groups.length; j++) {
            if (APP_DATA.groups[j].name === card.group && APP_DATA.groups[j].isBlocked) { gb = true; break; }
        }
        if (!gb) valid.push(card.text);
    }
    return valid;
}

function showTypingAndReply(cb) {
    var tip = document.getElementById('typingIndicator');
    if (tip) {
        document.getElementById('typingName').innerText = APP_DATA.settings.taName || '梦角';
        tip.classList.add('active');
    }
    var minS = APP_DATA.settings.minDelay || 1;
    var maxS = APP_DATA.settings.maxDelay || 3;
    var delay = Math.random() * (maxS - minS) * 1000 + minS * 1000;
    setTimeout(function() { cb(); }, delay);
}

window.triggerTaProactive = function() {
    if (isTaReplying) return showToast('对方正在输入中...');
    resetAutoSendTimer();
    triggerTaReply(null);
};

// 修复问卷：现在接收 userMsg 参数进行判定
function triggerTaReply(userMsg) {
    if (isTaReplying) return;
    isTaReplying = true;
    
    // 如果是问卷消息，走特殊处理逻辑
    if (userMsg && userMsg.type === 'choice') {
        var ans = [];
        for (var i = 0; i < userMsg.questions.length; i++) { 
            var opts = userMsg.questions[i].options; 
            ans.push(opts[Math.floor(Math.random() * opts.length)]); 
        }
        var taMsg = { sender: 'ta', type: 'text', text: '我选：' + ans.join('，'), time: Date.now() };
        showTypingAndReply(function() { 
            APP_DATA.chatHistory.push(taMsg); 
            appendMsgUI(taMsg, APP_DATA.chatHistory.length - 1); 
            saveData(); 
            scrollToBottom(); 
            document.getElementById('typingIndicator').classList.remove('active');
            isTaReplying = false; 
        });
        return;
    }
    
    // 普通消息或主动触发，走复合回复逻辑
    executeReplyLogic();
}

function executeReplyLogic() {
    // 1. 拍一拍拦截判定
    if (APP_DATA.settings.patEnabled && APP_DATA.patActions.length > 0 && Math.random() * 100 < APP_DATA.settings.patProb) {
        var taMsg = { sender: 'ta', type: 'pat', content: APP_DATA.patActions[Math.floor(Math.random() * APP_DATA.patActions.length)], time: Date.now() };
        showTypingAndReply(function() {
            APP_DATA.chatHistory.push(taMsg); appendMsgUI(taMsg, APP_DATA.chatHistory.length - 1);
            saveData(); scrollToBottom();
            document.getElementById('typingIndicator').classList.remove('active');
            isTaReplying = false;
        });
        return;
    }

    // 2. 连发数量判定
    var replyCount = 1;
    var r = Math.random();
    if (r < 0.05) replyCount = 3;
    else if (r < 0.25) replyCount = 2;

    // 3. 字卡清洗
    var validCards = getValidCards();
    if (validCards.length === 0) {
        showToast('没有可用字卡，无法回复！');
        isTaReplying = false;
        return;
    }

    // 收集最近10条我发的文字消息用于引用
    var recentUserTexts = [];
    for (var i = APP_DATA.chatHistory.length - 1; i >= 0 && recentUserTexts.length < 10; i--) {
        var m = APP_DATA.chatHistory[i];
        if (m.sender === 'user' && m.type === 'text') {
            recentUserTexts.push(m);
        }
    }

    var sentCount = 0;

    function sendNext() {
        if (sentCount >= replyCount) {
            document.getElementById('typingIndicator').classList.remove('active');
            isTaReplying = false;
            return;
        }
        sentCount++;

        showTypingAndReply(function() {
            var taMsg = { sender: 'ta', time: Date.now() };

            // 单条生成逻辑：30%图片，否则文字
            if (Math.random() < 0.3 && APP_DATA.imageEmojis.length > 0) {
                taMsg.type = 'image';
                taMsg.content = APP_DATA.imageEmojis[Math.floor(Math.random() * APP_DATA.imageEmojis.length)];
            } else {
                taMsg.type = 'text';
                taMsg.text = validCards[Math.floor(Math.random() * validCards.length)];
            }

            // 引用判定：连发第一句，30%概率
            if (sentCount === 1 && Math.random() < 0.3 && recentUserTexts.length > 0) {
                var quoteTarget = recentUserTexts[Math.floor(Math.random() * recentUserTexts.length)];
                taMsg.quote = { text: quoteTarget.text, type: quoteTarget.type, senderName: APP_DATA.settings.userName };
            }

            APP_DATA.chatHistory.push(taMsg);
            appendMsgUI(taMsg, APP_DATA.chatHistory.length - 1);
            scrollToBottom();
            saveData();

            sendNext();
        });
    }
    sendNext();
}

function resetAutoSendTimer() {
    if (autoSendTimer) clearTimeout(autoSendTimer);
    if (!APP_DATA.settings.autoSend) return;
    var minS = APP_DATA.settings.autoMin || 60;
    var maxS = APP_DATA.settings.autoMax || 120;
    var delay = Math.random() * (maxS - minS) * 1000 + minS * 1000;
    
    autoSendTimer = setTimeout(function() {
        if (document.hidden) { resetAutoSendTimer(); return; }
        if (!isTaReplying) {
            triggerTaReply(null); 
            resetAutoSendTimer();
        } else {
            resetAutoSendTimer(); 
        }
    }, delay);

function compressImage(file, maxW, maxH, quality, cb) { var reader = new FileReader(); reader.onload = function(ev) { var img = new Image(); img.onload = function() { var c = document.createElement('canvas'); var w = img.width, h = img.height; if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); cb(c.toDataURL('image/jpeg', quality)); }; img.src = ev.target.result; }; reader.readAsDataURL(file); }

    document.getElementById('callName').innerText = APP_DATA.settings.taName || '梦角';
    var av = document.getElementById('callAvatar');
    if (APP_DATA.settings.taAvatar) av.innerHTML = '<img src="' + APP_DATA.settings.taAvatar + '">';
    else av.innerText = (APP_DATA.settings.taName || 'T').charAt(0);
    var bg = APP_DATA.settings.callBg || APP_DATA.settings.chatBg || '';
    callWin.style.backgroundImage = bg ? 'url(' + bg + ')' : 'linear-gradient(180deg, #1c1d22, #333)';
    callWin.style.top = '50%'; callWin.style.left = '50%'; callWin.style.transform = 'translate(-50%, -50%)';
    callWin.style.width = '300px'; callWin.style.height = '480px';
    callWin.classList.add('active');
    document.getElementById('callTimer').innerText = '00:00';
    document.getElementById('callTimer').style.display = 'none';
    if (isIncoming) {
        callState = 'incoming';
        document.getElementById('callStatusText').innerText = '邀请你视频通话...';
        document.getElementById('btnCallAnswer').style.display = 'flex';
        document.getElementById('btnCallHangup').style.display = 'none';
        var missDelay = Math.random() < 0.3 ? (4000 + Math.random() * 6000) : 22000;
        callTimeoutTimer = setTimeout(function() { if (callState === 'incoming') endCall('missed'); }, missDelay);
    } else {
        callState = 'dialing';
        document.getElementById('callStatusText').innerText = '正在等待对方接受邀请...';
        document.getElementById('btnCallAnswer').style.display = 'none';
        document.getElementById('btnCallHangup').style.display = 'flex';
        if (Math.random() < 0.35) {
            var rejectDelay = 4000 + Math.random() * 8000;
            callTimeoutTimer = setTimeout(function() { if (callState === 'dialing') endCall('rejected'); }, rejectDelay);
        } else {
            var connectDelay = 1400 + Math.random() * 1400;
            callTimeoutTimer = setTimeout(function() { if (callState === 'dialing') connectCall(); }, connectDelay);
        }
    }
};
window.answerIncoming = function() { if (callState !== 'incoming') return; if (callTimeoutTimer) clearTimeout(callTimeoutTimer); connectCall(); };
function connectCall() { callState = 'connected'; document.getElementById('callStatusText').innerText = '通话中'; document.getElementById('btnCallAnswer').style.display = 'none'; document.getElementById('btnCallHangup').style.display = 'flex'; document.getElementById('callTimer').style.display = 'block'; callStartTime = Date.now(); if (callTimerInterval) clearInterval(callTimerInterval); callTimerInterval = setInterval(function() { var diff = Math.floor((Date.now() - callStartTime) / 1000); var m = Math.floor(diff / 60); var s = diff % 60; var timeStr = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s); document.getElementById('callTimer').innerText = timeStr; document.getElementById('capsuleTimer').innerText = timeStr; }, 1000); }
window.endCall = function(reason) { if (callState === 'idle') return; var duration = 0; if (callState === 'connected') { duration = Date.now() - callStartTime; } if (callTimeoutTimer) clearTimeout(callTimeoutTimer); if (callTimerInterval) clearInterval(callTimerInterval); document.getElementById('callWindow').classList.remove('active'); document.getElementById('callCapsule').classList.remove('active'); callState = 'idle'; var sysMsg = ''; if (reason === 'rejected') sysMsg = '对方已拒绝'; else if (reason === 'missed') sysMsg = '未接听'; else if (reason === 'hangup') { if (duration > 2000) { var diff = Math.floor(duration / 1000); var m = Math.floor(diff / 60); var s = diff % 60; sysMsg = '通话时长 ' + (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s); } else { showToast('通话已挂断'); } } if (sysMsg) { var msg = { sender: 'system', type: 'system_call', content: '视频通话已结束 · ' + sysMsg, time: Date.now() }; APP_DATA.chatHistory.push(msg); appendMsgUI(msg, APP_DATA.chatHistory.length - 1); saveData(); scrollToBottom(); } scheduleRandomCall(); };
window.minimizeCall = function() { document.getElementById('callWindow').classList.remove('active'); document.getElementById('callCapsule').classList.add('active'); };
window.restoreCall = function() { document.getElementById('callCapsule').classList.remove('active'); document.getElementById('callWindow').classList.add('active'); };
var dragHeader = document.getElementById('callDragHeader'); var resizeHandle = document.getElementById('callResizeHandle'); var callWin = document.getElementById('callWindow');
function startDrag(e) { isDragging = true; var clientX = e.touches ? e.touches[0].clientX : e.clientX; var clientY = e.touches ? e.touches[0].clientY : e.clientY; var rect = callWin.getBoundingClientRect(); startX = clientX; startY = clientY; startLeft = rect.left; startTop = rect.top; callWin.style.transform = 'none'; callWin.style.left = startLeft + 'px'; callWin.style.top = startTop + 'px'; }
function doDrag(e) { if (!isDragging) return; e.preventDefault(); var clientX = e.touches ? e.touches[0].clientX : e.clientX; var clientY = e.touches ? e.touches[0].clientY : e.clientY; var dx = clientX - startX; var dy = clientY - startY; callWin.style.left = (startLeft + dx) + 'px'; callWin.style.top = (startTop + dy) + 'px'; }

dragHeader.addEventListener('touchstart', startDrag, {passive: false}); dragHeader.addEventListener('mousedown', startDrag); window.addEventListener('touchmove', doDrag, {passive: false}); window.addEventListener('mousemove', doDrag); window.addEventListener('touchend', endDrag); window.addEventListener('mouseup', endDrag);
function startResize(e) { isResizing = true; var clientX = e.touches ? e.touches[0].clientX : e.clientX; var clientY = e.touches ? e.touches[0].clientY : e.clientY; startX = clientX; startY = clientY; startWidth = callWin.offsetWidth; startHeight = callWin.offsetHeight; e.stopPropagation(); }
function doResize(e) { if (!isResizing) return; e.preventDefault(); var clientX = e.touches ? e.touches[0].clientX : e.clientX; var clientY = e.touches ? e.touches[0].clientY : e.clientY; var dw = clientX - startX; var dh = clientY - startY; callWin.style.width = Math.max(200, startWidth + dw) + 'px'; callWin.style.height = Math.max(300, startHeight + dh) + 'px'; }
function endResize() { isResizing = false; }
resizeHandle.addEventListener('touchstart', startResize, {passive: false}); resizeHandle.addEventListener('mousedown', startResize); window.addEventListener('touchmove', doResize, {passive: false}); window.addEventListener('mousemove', doResize); window.addEventListener('touchend', endResize); window.addEventListener('mouseup', endResize);
function scheduleRandomCall() { if (randomCallTimer) clearTimeout(randomCallTimer); if (!APP_DATA.settings.callEnabled || callState !== 'idle') return; var delay = (15 * 60 * 1000) + Math.random() * (45 * 60 * 1000); randomCallTimer = setTimeout(function() { if (document.hidden) { scheduleRandomCall(); return; } if (callState === 'idle' && Math.random() < 0.25) window.startCall(true); else scheduleRandomCall(); }, delay); }
