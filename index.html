<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>与 梦角 的聊天</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background-color: #f5f5f5; font-family: sans-serif; overflow: hidden; }
        
        button, .clickable { touch-action: manipulation; cursor: pointer; }

        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 600px; margin: 0 auto; background-color: #EDEDED; position: relative; }

        .header { height: 50px; background-color: #f7f7f7; display: flex; align-items: center; justify-content: center; padding: 0 15px; border-bottom: 1px solid #E0E0E0; flex-shrink: 0; z-index: 10; position: relative; }
        .header-btn { position: absolute; right: 15px; font-size: 14px; color: #576b95; background: transparent; border: none; padding: 8px; font-weight: bold; z-index: 99; }
        .header-title { font-size: 17px; font-weight: bold; color: #333; }

        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-color: #EDEDED; background-size: cover; background-position: center; background-repeat: no-repeat; }
        .message-row { display: flex; align-items: flex-start; margin-bottom: 15px; width: 100%; }
        .message-row.ta { flex-direction: row; }
        .message-row.user { flex-direction: row-reverse; }

        .pat-message { text-align: center; font-size: 12px; color: #999; margin: 10px 0; width: 100%; }
        .pat-message::before, .pat-message::after { content: '✦'; margin: 0 8px; }

        .avatar { width: 40px; height: 40px; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; font-weight: bold; overflow: hidden; background-color: #ccc; }
        .avatar.ta { background-color: #6c9ef8; }
        .avatar.user { background-color: #f8a36c; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .bubble { max-width: 70%; padding: 10px 14px; border-radius: 8px; font-size: 16px; line-height: 1.4; word-break: break-all; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .bubble.ta { background-color: #FFFFFF; color: #333; margin-left: 10px; border-top-left-radius: 2px; }
        .bubble.user { background-color: #95EC69; color: #333; margin-right: 10px; border-top-right-radius: 2px; }
        
        .bubble.only-image { background: transparent !important; padding: 0 !important; box-shadow: none; }
        .bubble.only-image img { max-width: 120px; max-height: 120px; border-radius: 8px; display: block; }

        .bubble.choice-card { background: #fff; padding: 0; border-radius: 12px; border: 1px solid #eee; overflow: hidden; width: 240px; }
        .choice-header { background: #f8f8f8; padding: 12px; font-size: 15px; font-weight: bold; color: #333; border-bottom: 1px solid #eee; text-align: center; }
        .choice-body { padding: 12px; }
        .choice-q-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .choice-opt { font-size: 13px; color: #666; background: #f5f5f5; padding: 8px 12px; border-radius: 6px; margin-bottom: 5px; }

        .quote-box { background-color: rgba(0, 0, 0, 0.05); padding: 6px 10px; border-radius: 4px; font-size: 13px; color: #666; margin-bottom: 6px; border-left: 2px solid #999; }
        .typing-indicator { display: none; font-size: 12px; color: #666; margin-left: 50px; padding-bottom: 5px; }

        .input-area { background-color: #f7f7f7; border-top: 1px solid #E0E0E0; flex-shrink: 0; z-index: 10; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
        .quote-preview { display: none; background: #e5e5e5; padding: 8px 10px; margin: 10px 12px 0 12px; border-radius: 4px; font-size: 13px; color: #666; border-left: 3px solid #07C160; position: relative; }
        .quote-preview.active { display: block; }
        .quote-preview .close-quote { position: absolute; right: 5px; top: 5px; background: none; border: none; color: #999; font-size: 16px; font-weight: bold; }

        .input-row { display: flex; align-items: flex-end; padding: 10px 12px; }
        .tool-btn { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; margin-right: 10px; margin-bottom: 3px; color: #333; font-size: 24px; }
        .input-box { flex: 1; background: #fff; border-radius: 4px; padding: 8px 12px; border: none; outline: none; font-size: 16px; resize: none; max-height: 100px; line-height: 1.4; font-family: inherit; margin-right: 10px; }
        .send-btn { background-color: #07C160; color: white; border: none; border-radius: 4px; padding: 8px 16px; font-size: 15px; flex-shrink: 0; height: 38px; }
        .send-btn:disabled { background-color: #ccc; }

        .bottom-panel { height: 260px; background: #f7f7f7; border-top: 1px solid #e0e0e0; display: none; flex-direction: column; }
        .bottom-panel.active { display: flex; }
        .panel-tabs { display: flex; border-bottom: 1px solid #e0e0e0; background: #fff; padding: 0 15px; }
        .panel-tab { padding: 12px 15px; font-size: 15px; color: #666; background: transparent; border: none; font-weight: bold; }
        .panel-tab.active { color: #FF8A9F; border-bottom: 3px solid #FF8A9F; }
        .panel-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .panel-content.active { display: block; }
        .emoji-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .emoji-image-item { width: 60px; height: 60px; background: #fff; border-radius: 8px; border: none; padding: 0; overflow: hidden; }
        .emoji-image-item img { width: 100%; height: 100%; object-fit: cover; }
        .choice-tab-btn { background: #FFF; color: #FF8A9F; border: 1px solid #FF8A9F; padding: 10px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; display: block; margin: 20px auto; }

        .action-menu-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); display: none; z-index: 999; justify-content: center; align-items: center; }
        .action-menu-overlay.active { display: flex; }
        .action-menu { background: #fff; border-radius: 12px; display: flex; padding: 15px 20px; gap: 25px; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; background: transparent; border: none; color: #333; }
        .action-icon { width: 40px; height: 40px; background: #f5f5f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .action-item.delete { color: #ff3b30; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f2f2f6; display: none; z-index: 100; flex-direction: column; overflow-y: auto; }
        .modal-overlay.active { display: flex; }

        .settings-page { width: 100%; height: 100%; display: flex; flex-direction: column; background: #f2f2f6; position: relative;}
        .settings-header { height: 50px; background: #fff; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #E0E0E0; position: relative; z-index: 10; }
        .settings-header .back-btn { font-size: 16px; color: #333; background: transparent; border: none; padding: 10px; z-index: 2; font-weight: bold; }
        .settings-header h3 { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: bold; color: #333; pointer-events: none; }

        .settings-body { flex: 1; overflow-y: auto; padding: 20px 15px; }
        .setting-list { background: #fff; border-radius: 12px; overflow: hidden; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid #f0f0f0; background: transparent; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; }
        .setting-title { font-size: 16px; color: #333; font-weight: bold; display: block; }
        .setting-subtitle { font-size: 13px; color: #FF8A9F; display: block; margin-top: 4px; }

        .sub-page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #f2f2f6; display: none; flex-direction: column; z-index: 20; }
        .sub-page.active { display: flex; }

        .form-group { background: #fff; border-radius: 12px; padding: 0 16px; margin-bottom: 20px; }
        .form-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
        .form-row:last-child { border-bottom: none; }
        .form-label { font-size: 15px; color: #333; font-weight: bold; }
        .form-input { flex: 1; border: none; outline: none; font-size: 15px; text-align: right; background: transparent; color: #333; }
        
        .avatar-upload { width: 50px; height: 50px; border-radius: 8px; background: #f0f0f0; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #999; font-size: 12px; position: relative; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 10; }
        
        .btn-primary { width: 100%; background: #07C160; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; margin-top: 10px; }

        .list-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-select-all { background: #fff; border: 1px solid #e0e0e0; padding: 6px 12px; border-radius: 20px; font-size: 13px; color: #666; }
        .btn-batch-del { background: #ffebeb; color: #ff3b30; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; }
        
        .selectable-list { display: flex; flex-direction: column; gap: 10px; }
        .select-item { display: flex; align-items: center; gap: 12px; background: #fff; padding: 15px; border-radius: 12px; }
        .select-item input[type="checkbox"] { width: 20px; height: 20px; }
        .select-item-content { flex: 1; font-size: 14px; color: #333; word-break: break-all; }
        .select-item-content img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }

        .batch-import-box { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .batch-textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }        .slider-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
        .slider-label { font-size: 15px; color: #333; font-weight: bold; width: 70px; }
        .slider-value { font-size: 15px; color: #07C160; width: 45px; text-align: right; font-weight: bold; }
        input[type=range] { flex: 1; margin: 0 15px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 28px; }
        .slider-toggle:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        .switch input:checked + .slider-toggle { background-color: #07C160; }
        .switch input:checked + .slider-toggle:before { transform: translateX(22px); }

        .danger-zone { margin-top: 20px; }
        .danger-title { font-size: 14px; color: #ff3b30; font-weight: bold; margin-bottom: 10px; padding-left: 5px;}
        .danger-cards { display: flex; gap: 10px; }
        .danger-card { flex: 1; background: #fff; border: 1px solid #ffe0e0; border-radius: 12px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .danger-icon-box { width: 50px; height: 50px; border-radius: 50%; background: #fff5f5; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .danger-icon-box svg { width: 24px; height: 24px; fill: #ff3b30; }
        .danger-card-title { font-size: 15px; color: #333; font-weight: bold; margin-bottom: 5px; }
        .danger-card-desc { font-size: 12px; color: #999; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="header-title" id="headerTitle">梦角</div>
        <button class="header-btn" onclick="openSettings()">设置</button>
    </div>

    <div class="chat-container" id="chatContainer"></div>
    <div class="typing-indicator" id="typingIndicator">正在输入...</div>

    <div class="input-area">
        <div class="quote-preview" id="quotePreview">
            <span id="quotePreviewText"></span>
            <button class="close-quote" onclick="cancelQuote()">×</button>
        </div>
        
        <div class="input-row">
            <button class="tool-btn" onclick="toggleToolPanel()">
                <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: none; stroke: #333; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
            </button>
            <textarea class="input-box" id="messageInput" rows="1" placeholder="输入消息..." oninput="handleInput(this)" onkeydown="handleEnter(event)"></textarea>
            <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">发送</button>
        </div>

        <div class="bottom-panel" id="bottomPanel">
            <div class="panel-tabs">
                <button class="panel-tab active" id="tabEmoji" onclick="switchTab('emoji')">表情包</button>
                <button class="panel-tab" id="tabChoice" onclick="switchTab('choice')">抉择</button>
            </div>
            <div class="panel-content active" id="emojiTabContent">
                <div class="emoji-grid" id="emojiPanelContent"></div>
            </div>
            <div class="panel-content" id="choiceTabContent">
                <button class="choice-tab-btn" onclick="openChoiceEditor()">＋ 新建抉择</button>
            </div>
        </div>
    </div>

    <div class="action-menu-overlay" id="actionMenuOverlay" onclick="closeActionMenu(event)">
        <div class="action-menu">
            <button class="action-item" onclick="handleQuoteAction()">
                <div class="action-icon">❞</div>引用
            </button>
            <button class="action-item delete" onclick="handleDeleteAction()">
                <div class="action-icon">🗑</div>删除
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="choiceEditorModal">
        <div class="settings-page" style="background: #f2f2f6; padding: 20px;">
            <div class="form-group" style="padding: 15px; background: #fff; border-radius: 12px;">
                <label class="form-label">问卷标题</label>
                <input type="text" class="form-input" id="ceTitle" value="测一测" style="text-align:left; border-bottom:1px solid #eee; padding:5px 0;">
            </div>
            <div id="ceQuestionList"></div>
            <button class="btn-primary" style="background:#fff; color:#666; border:1px dashed #ccc;" onclick="addChoiceQuestion()">＋ 添加一题</button>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-primary" style="background:#ccc; flex:1;" onclick="closeChoiceEditor()">取消</button>
                <button class="btn-primary" style="background:#FF8A9F; flex:2;" onclick="submitChoice()">邀请回答</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="settings-page">
            <div class="settings-header" id="mainSettingsHeader">
                <button class="back-btn" onclick="closeSettings()">返回</button>
                <h3>设置</h3>
            </div>
            <div class="settings-body">
                <div class="setting-list" id="mainSettingList">
                    <button class="setting-item" onclick="switchSubPage('avatarPage')">
                        <div><span class="setting-title">角色头像及名称</span><span class="setting-subtitle">设置角色和你的头像、昵称</span></div>
                    </button>
                    <button class="setting-item" onclick="switchSubPage('cardsPage')">
                        <div><span class="setting-title">字卡管理</span><span class="setting-subtitle">管理角色的专属回复字卡</span></div>
                    </button>
                    <button class="setting-item" onclick="switchSubPage('emojisPage')">
                        <div><span class="setting-title">表情包管理</span><span class="setting-subtitle">批量管理图片表情包</span></div>
                    </button>
                    <button class="setting-item" onclick="switchSubPage('patPage')">
                        <div><span class="setting-title">拍一拍管理</span><span class="setting-subtitle">自定义动作与概率</span></div>
                    </button>
                    <button class="setting-item" onclick="switchSubPage('delayPage')">
                        <div><span class="setting-title">回复频率与节奏</span><span class="setting-subtitle">主动发消息、回复速度</span></div>
                    </button>
                    <button class="setting-item" onclick="switchSubPage('bgPage')">
                        <div><span class="setting-title">聊天背景</span><span class="setting-subtitle">更换沉浸式聊天背景图</span></div>
                    </button>
                    <button class="setting-item" onclick="switchSubPage('dataPage')">
                        <div><span class="setting-title">数据管理</span><span class="setting-subtitle">导入、导出及清空数据</span></div>
                    </button>
                </div>
            </div>

            <!-- 头像 -->
            <div class="sub-page" id="avatarPage">
                <div class="settings-header">
                    <button class="back-btn" onclick="switchSubPage('main')">返回</button>
                    <h3>角色头像及名称</h3>
                </div>
                <div class="settings-body">
                    <div class="form-group" style="margin-top: 10px;">
                        <div class="form-row" style="justify-content: center;">
                            <label class="avatar-upload" style="width: 80px; height: 80px; border-radius: 50%;">
                                <img id="taAvatarImg" style="display:none;">
                                <span id="taAvatarText" style="pointer-events: none;">上传</span>
                                <input type="file" id="taAvatarInput" accept="image/*" onchange="handleImgUpload(event, 'ta')">
                            </label>
                        </div>
                        <div class="form-row"><div class="form-label">角色名称</div><input type="text" class="form-input" id="taNameInput"></div>
                    </div>
                    <div class="form-group">
                        <div class="form-row" style="justify-content: center;">
                            <label class="avatar-upload" style="width: 80px; height: 80px; border-radius: 50%;">
                                <img id="userAvatarImg" style="display:none;">
                                <span id="userAvatarText" style="pointer-events: none;">上传</span>
                                <input type="file" id="userAvatarInput" accept="image/*" onchange="handleImgUpload(event, 'user')">
                            </label>
                        </div>
                        <div class="form-row"><div class="form-label">我的昵称</div><input type="text" class="form-input" id="userNameInput"></div>
                    </div>
                    <button class="btn-primary" onclick="saveAvatarAndName()">保存修改</button>
                </div>
            </div>

            <!-- 字卡 -->            <div class="sub-page" id="cardsPage">
                <div class="settings-header">
                    <button class="back-btn" onclick="switchSubPage('main')">返回</button>
                    <h3>字卡管理</h3>
                </div>
                <div class="settings-body">
                    <div class="batch-import-box">
                        <div style="font-weight:bold; margin-bottom:10px;">批量添加回复</div>
                        <textarea class="batch-textarea" id="batchCardsInput" placeholder="每行一条..."></textarea>
                        <button class="btn-primary" onclick="batchAddCards()">批量导入</button>
                    </div>
                    <div class="list-top-bar">
                        <button class="btn-select-all" id="btnSelectAllCards" onclick="toggleSelectAll('cardList', 'btnSelectAllCards')">全选</button>
                        <button class="btn-batch-del" onclick="batchDelete('cardList', 'cards')">删除选中</button>
                    </div>
                    <div class="selectable-list" id="cardList"></div>
                </div>
            </div>

            <!-- 表情包 -->
            <div class="sub-page" id="emojisPage">
                <div class="settings-header">
                    <button class="back-btn" onclick="switchSubPage('main')">返回</button>
                    <h3>表情包管理</h3>
                </div>
                <div class="settings-body">
                    <div class="batch-import-box" style="text-align: center;">
                        <label class="btn-primary" style="display: inline-block; position: relative; overflow: hidden;">
                            批量上传图片
                            <input type="file" id="emojiImageInput" accept="image/*" multiple style="position: absolute; top:0; left:0; width:100%; height:100%; opacity:0;" onchange="handleEmojiUpload(event)">
                        </label>
                    </div>
                    <div class="list-top-bar">
                        <button class="btn-select-all" id="btnSelectAllEmojis" onclick="toggleSelectAll('emojiImageSettingsList', 'btnSelectAllEmojis')">全选</button>
                        <button class="btn-batch-del" onclick="batchDelete('emojiImageSettingsList', 'imageEmojis')">删除选中</button>
                    </div>
                    <div class="selectable-list" id="emojiImageSettingsList"></div>
                </div>
            </div>

            <!-- 拍一拍 -->
            <div class="sub-page" id="patPage">
                <div class="settings-header">
                    <button class="back-btn" onclick="switchSubPage('main')">返回</button>
                    <h3>拍一拍管理</h3>
                </div>
                <div class="settings-body">
                    <div class="form-group">
                        <div class="slider-row">
                            <div class="slider-label">允许拍一拍</div>
                            <label class="switch"><input type="checkbox" id="patEnabledSwitch"><span class="slider-toggle"></span></label>
                        </div>
                        <div class="slider-row">
                            <div class="slider-label">触发概率</div>
                            <input type="range" id="patProbabilitySlider" min="1" max="100">
                            <div class="slider-value" id="patProbabilityVal">30%</div>
                        </div>
                    </div>
                    <div class="batch-import-box">
                        <textarea class="batch-textarea" id="batchPatActionsInput" placeholder="每行一个动作..."></textarea>
                        <button class="btn-primary" onclick="batchAddPatActions()">导入动作</button>
                    </div>
                    <div class="list-top-bar">
                        <button class="btn-select-all" id="btnSelectAllPats" onclick="toggleSelectAll('patActionList', 'btnSelectAllPats')">全选</button>
                        <button class="btn-batch-del" onclick="batchDelete('patActionList', 'patActions')">删除选中</button>
                    </div>
                    <div class="selectable-list" id="patActionList"></div>
                    <button class="btn-primary" style="margin-top:20px;" onclick="savePatSettings()">保存拍一拍设置</button>
                </div>
            </div>

            <!-- 频率 -->
            <div class="sub-page" id="delayPage">
                <div class="settings-header">
                    <button class="back-btn" onclick="switchSubPage('main')">返回</button>
                    <h3>回复频率与节奏</h3>
                </div>
                <div class="settings-body">
                    <div class="form-group">
                        <div class="slider-row">
                            <div class="slider-label">最短等待</div>
                            <input type="range" id="minDelaySlider" min="0" max="10" step="0.5">
                            <div class="slider-value" id="minDelayVal">1s</div>
                        </div>
                        <div class="slider-row">
                            <div class="slider-label">最长等待</div>
                            <input type="range" id="maxDelaySlider" min="1" max="60">
                            <div class="slider-value" id="maxDelayVal">3s</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="slider-row">
                            <div class="slider-label">主动发消息</div>
                            <label class="switch"><input type="checkbox" id="autoSendSwitch"><span class="slider-toggle"></span></label>
                        </div>
                        <div class="slider-row">
                            <div class="slider-label">间隔</div>
                            <input type="range" id="autoSendIntervalSlider" min="1" max="60">
                            <div class="slider-value" id="autoSendIntervalVal">2分</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="slider-row">
                            <div class="slider-label">表情混入</div>
                            <label class="switch"><input type="checkbox" id="mixEmojiSwitch"><span class="slider-toggle"></span></label>
                        </div>
                    </div>
                    <button class="btn-primary" onclick="saveFrequencySettings()">保存频率设置</button>
                </div>
            </div>

            <!-- 背景 -->
            <div class="sub-page" id="bgPage">
                <div class="settings-header">
                    <button class="back-btn" onclick="switchSubPage('main')">返回</button>
                    <h3>聊天背景</h3>
                </div>
                <div class="settings-body">
                    <div class="form-group" style="padding: 20px; text-align: center;">
                        <label class="avatar-upload" style="width: 120px; height: 200px; margin: 0 auto;">
                            <img id="bgImg" style="display:none; width: 100%; height: 100%; object-fit: cover;">
                            <span id="bgText" style="pointer-events: none;">点击上传</span>
                            <input type="file" id="bgInput" accept="image/*" onchange="handleImgUpload(event, 'bg')">
                        </label>
                        <button class="btn-primary" style="background:#ff3b30; margin-top:20px;" onclick="resetBg()">恢复默认</button>
                    </div>
                </div>
            </div>

            <!-- 数据管理 -->
            <div class="sub-page" id="dataPage">
                <div class="settings-header">
                    <button class="back-btn" onclick="switchSubPage('main')">返回</button>
                    <h3>数据管理</h3>
                </div>
                <div class="settings-body">
                    <div class="form-group" style="padding: 15px; text-align: center;">
                        <button class="btn-primary" onclick="exportData()">导出数据（下载文件）</button>
                        
                        <!-- 原生按钮触发文件选择，最稳 -->
                        <button class="btn-primary" style="background:#FF8A9F; margin-top:15px;" onclick="triggerImport()">导入数据（选择文件）</button>
                        <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;" onchange="doImport(event)">
                    </div>

                    <div class="danger-zone">
                        <div class="danger-title">⚠ 危险操作</div>
                        <div class="danger-cards">
                            <div class="danger-card" onclick="clearChatOnly()">
                                <div class="danger-icon-box">
                                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                </div>
                                <div class="danger-card-title" style="color: #d4a373;">清除会话</div>
                                <div class="danger-card-desc">删除本会话消息</div>
                            </div>
                            <div class="danger-card" onclick="clearAllData()">
                                <div class="danger-icon-box" style="background: #ffebeb;">
                                    <svg viewBox="0 0 24 24" style="fill: #ff3b30;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                                </div>
                                <div class="danger-card-title" style="color: #ff3b30;">重置数据</div>
                                <div class="danger-card-desc" style="color: #ff3b30;">清空所有，不可撤销</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>    // --- 全局变量 (绝对不使用 let/const) ---
    var chatHistory = [], cards = [], textEmojis = [], imageEmojis = [], patActions = [];
    var currentActionMsgIndex = -1, currentQuoteMsg = null, autoSendTimer = null; 
    var currentSettings = {};
    var tempSettings = {};
    var editingChoiceData = { title: '测一测', questions: [{ q: '', options: ['', ''] }] };
    
    var defaultSettings = {
        userName: "我", taName: "梦角", userAvatar: "", taAvatar: "", chatBg: "",
        minDelay: 1, maxDelay: 3, autoSendEnabled: false, autoSendInterval: 2, 
        mixEmoji: false, patEnabled: true, patProbability: 30
    };

    // 原生 ES5 初始化
    window.onload = function() {
        try {
            var savedSettings = localStorage.getItem('chat_settings');
            if (savedSettings) {
                currentSettings = JSON.parse(savedSettings);
                for(var k in defaultSettings) { if(!currentSettings[k]) currentSettings[k] = defaultSettings[k]; }
            } else {
                currentSettings = JSON.parse(JSON.stringify(defaultSettings));
            }
            tempSettings = JSON.parse(JSON.stringify(currentSettings));

            if(localStorage.getItem('chat_history')) chatHistory = JSON.parse(localStorage.getItem('chat_history'));
            if(localStorage.getItem('ta_cards')) cards = JSON.parse(localStorage.getItem('ta_cards'));
            if(localStorage.getItem('text_emojis')) textEmojis = JSON.parse(localStorage.getItem('text_emojis'));
            if(localStorage.getItem('image_emojis')) imageEmojis = JSON.parse(localStorage.getItem('image_emojis'));
            if(localStorage.getItem('pat_actions')) patActions = JSON.parse(localStorage.getItem('pat_actions'));
            else patActions = ["悄悄亲了一下我的脸颊", "拍了拍我的头", "抱住了我"];

            applySettings();
            renderChatHistory();
            scrollToBottom();
            resetAutoSendTimer(); 

            // 绑定输入框事件
            var msgInput = document.getElementById('messageInput');
            if(msgInput) {
                msgInput.addEventListener('input', function() {
                    document.getElementById('sendBtn').disabled = this.value.trim().length === 0;
                });
                msgInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!document.getElementById('sendBtn').disabled) sendMessage(); }
                });
            }
            
            // 滑块事件绑定 (用原生 DOM 风格)
            var minD = document.getElementById('minDelaySlider');
            if(minD) {
                minD.addEventListener('input', function() {
                    var v = parseFloat(this.value); document.getElementById('minDelayVal').innerText = v + 's';
                    if(v >= parseFloat(document.getElementById('maxDelaySlider').value)) { document.getElementById('maxDelaySlider').value = v + 1; document.getElementById('maxDelayVal').innerText = (v+1) + 's'; }
                });
            }
            var maxD = document.getElementById('maxDelaySlider');
            if(maxD) maxD.addEventListener('input', function() { document.getElementById('maxDelayVal').innerText = this.value + 's'; });
            var autoI = document.getElementById('autoSendIntervalSlider');
            if(autoI) autoI.addEventListener('input', function() { document.getElementById('autoSendIntervalVal').innerText = this.value + '分'; });
            var patP = document.getElementById('patProbabilitySlider');
            if(patP) patP.addEventListener('input', function() { document.getElementById('patProbabilityVal').innerText = this.value + '%'; });

        } catch(e) { alert("初始化异常：" + e.message); }
    };

    function triggerImport() {
        document.getElementById('importFileInput').click();
    }

    // --- 供 HTML onclick 调用的全局函数 ---
    function openSettings() {
        refreshFormUI(); renderCards(); renderEmojiSettings(); renderPatActions();
        document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() { 
        document.getElementById('settingsModal').classList.remove('active'); 
        setTimeout(function(){ switchSubPage('main'); }, 300); 
    }

    function switchSubPage(pageId) {
        if (pageId === 'main') {
            tempSettings = JSON.parse(JSON.stringify(currentSettings)); 
            var pages = document.querySelectorAll('.sub-page');
            for(var i=0; i<pages.length; i++) { pages[i].classList.remove('active'); }
            refreshFormUI(); 
        } else {
            var target = document.getElementById(pageId);
            if(target) target.classList.add('active');
            refreshFormUI(); 
        }
    }

    function refreshFormUI() {
        document.getElementById('userNameInput').value = currentSettings.userName;
        document.getElementById('taNameInput').value = currentSettings.taName;
        
        if (currentSettings.userAvatar) {
            document.getElementById('userAvatarImg').src = currentSettings.userAvatar; document.getElementById('userAvatarImg').style.display = 'block'; document.getElementById('userAvatarText').style.display = 'none';
        } else {
            document.getElementById('userAvatarImg').style.display = 'none'; document.getElementById('userAvatarText').style.display = 'block';
        }
        
        if (currentSettings.taAvatar) {
            document.getElementById('taAvatarImg').src = currentSettings.taAvatar; document.getElementById('taAvatarImg').style.display = 'block'; document.getElementById('taAvatarText').style.display = 'none';
        } else {
            document.getElementById('taAvatarImg').style.display = 'none'; document.getElementById('taAvatarText').style.display = 'block';
        }
        
        if (currentSettings.chatBg) {
            document.getElementById('bgImg').src = currentSettings.chatBg; document.getElementById('bgImg').style.display = 'block'; document.getElementById('bgText').style.display = 'none';
        } else {
            document.getElementById('bgImg').style.display = 'none'; document.getElementById('bgText').style.display = 'block';
        }

        document.getElementById('minDelaySlider').value = currentSettings.minDelay; document.getElementById('minDelayVal').innerText = currentSettings.minDelay + 's';
        document.getElementById('maxDelaySlider').value = currentSettings.maxDelay; document.getElementById('maxDelayVal').innerText = currentSettings.maxDelay + 's';
        document.getElementById('autoSendSwitch').checked = currentSettings.autoSendEnabled; document.getElementById('autoSendIntervalSlider').value = currentSettings.autoSendInterval; document.getElementById('autoSendIntervalVal').innerText = currentSettings.autoSendInterval + '分'; 
        document.getElementById('patEnabledSwitch').checked = currentSettings.patEnabled; document.getElementById('patProbabilitySlider').value = currentSettings.patProbability; document.getElementById('patProbabilityVal').innerText = currentSettings.patProbability + '%'; 
        document.getElementById('mixEmojiSwitch').checked = currentSettings.mixEmoji;
    }

    function saveAvatarAndName() {
        currentSettings.userName = document.getElementById('userNameInput').value.trim() || "我";
        currentSettings.taName = document.getElementById('taNameInput').value.trim() || "梦角";
        saveAllData(); applySettings(); renderChatHistory(); switchSubPage('main');
    }

    function savePatSettings() {
        currentSettings.patEnabled = document.getElementById('patEnabledSwitch').checked;
        currentSettings.patProbability = parseInt(document.getElementById('patProbabilitySlider').value);
        saveAllData(); alert("拍一拍设置已保存！"); switchSubPage('main');
    }

    function saveFrequencySettings() {
        currentSettings.minDelay = parseFloat(document.getElementById('minDelaySlider').value);
        currentSettings.maxDelay = parseFloat(document.getElementById('maxDelaySlider').value);
        currentSettings.autoSendEnabled = document.getElementById('autoSendSwitch').checked;
        currentSettings.autoSendInterval = parseInt(document.getElementById('autoSendIntervalSlider').value);
        currentSettings.mixEmoji = document.getElementById('mixEmojiSwitch').checked;
        saveAllData(); resetAutoSendTimer(); alert("频率设置已保存！"); switchSubPage('main');
    }

    function resetBg() { 
        currentSettings.chatBg = ""; document.getElementById('bgImg').style.display = 'none'; document.getElementById('bgText').style.display = 'block'; saveAllData(); applySettings(); 
    }

    // --- 聊天渲染逻辑 ---
    function applySettings() {
        document.getElementById('headerTitle').innerText = currentSettings.taName || '梦角';
        document.title = "与 " + (currentSettings.taName || '梦角') + " 的聊天";
        document.getElementById('chatContainer').style.backgroundImage = currentSettings.chatBg ? 'url('+currentSettings.chatBg+')' : 'none';
    }

    function renderChatHistory() {
        var box = document.getElementById('chatContainer'); box.innerHTML = '';
        for(var i=0; i<chatHistory.length; i++) { try{ appendMessageToUI(chatHistory[i], i); }catch(e){} }
    }

    function appendMessageToUI(msg, index) {
        if (!msg) return;
        if (msg.type === 'pat') {
            var div = document.createElement('div'); div.className = 'pat-message'; div.innerText = currentSettings.taName + ' ' + msg.content;
            document.getElementById('chatContainer').appendChild(div); return;
        }
        var row = document.createElement('div'); row.className = 'message-row ' + msg.sender;
        var avatar = document.createElement('div'); avatar.className = 'avatar ' + msg.sender;
        var isUser = msg.sender === 'user';
        var img = isUser ? currentSettings.userAvatar : currentSettings.taAvatar;
        var name = isUser ? currentSettings.userName : currentSettings.taName;
        avatar.innerHTML = img ? '<img src="'+img+'">' : (name ? name.charAt(0).toUpperCase() : (isUser ? '我' : 'TA'));
        
        var bubble = document.createElement('div');
        if (msg.type === 'choice' && msg.questions) {
            bubble.className = 'bubble choice-card';
            var qHTML = '';
            for(var i=0; i<msg.questions.length; i++) {
                var q = msg.questions[i];
                qHTML += '<div style="margin-top:10px;"><div class="choice-q-title">'+(i+1)+'. '+q.q+'</div>';
                for(var j=0; j<q.options.length; j++) qHTML += '<div class="choice-opt">'+q.options[j]+'</div>';
                qHTML += '</div>';
            }
            bubble.innerHTML = '<div class="choice-header">'+(msg.title||'问卷')+'</div><div class="choice-body">'+qHTML+'</div>';
        } else if (msg.type === 'image' && !msg.quote) {
            bubble.className = 'bubble only-image'; bubble.innerHTML = '<img src="'+(msg.content||'')+'">';
        } else {
            bubble.className = 'bubble ' + msg.sender;
            var html = msg.quote ? '<div class="quote-box">'+msg.quote.senderName+'：'+(msg.quote.type==='image'?'[图片表情]':msg.quote.text)+'</div>' : '';
            html += msg.type === 'image' ? '<img src="'+msg.content+'" style="max-width:120px; border-radius:4px;">' : '<span style="word-break: break-word;">'+(msg.text||'')+'</span>';
            bubble.innerHTML = html;
        }
        
        if (msg.type !== 'choice' && msg.type !== 'pat') {
            var timer = null;
            bubble.ontouchstart = function(e) { timer = setTimeout(function(){ currentActionMsgIndex = index; document.getElementById('actionMenuOverlay').classList.add('active'); if (navigator.vibrate) navigator.vibrate(50); }, 500); };
            bubble.ontouchend = function() { clearTimeout(timer); };
            bubble.ontouchmove = function() { clearTimeout(timer); };
            bubble.onmousedown = function(e) { timer = setTimeout(function(){ currentActionMsgIndex = index; document.getElementById('actionMenuOverlay').classList.add('active'); }, 500); };
            bubble.onmouseup = function() { clearTimeout(timer); };
            bubble.onmouseleave = function() { clearTimeout(timer); };
        }
        row.appendChild(avatar); row.appendChild(bubble); document.getElementById('chatContainer').appendChild(row);
    }

    function scrollToBottom() { setTimeout(function(){ var c = document.getElementById('chatContainer'); c.scrollTop = c.scrollHeight; }, 50); }

    // 输入与发送    function handleInput(el) { document.getElementById('sendBtn').disabled = el.value.trim().length === 0; }
    function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!document.getElementById('sendBtn').disabled) sendMessage(); } }

    function sendMessage() {
        var text = document.getElementById('messageInput').value.trim();
        if (!text) return;
        var msg = { sender: 'user', type: 'text', text: text, time: Date.now() };
        if (currentQuoteMsg) { msg.quote = JSON.parse(JSON.stringify(currentQuoteMsg)); cancelQuote(); }
        chatHistory.push(msg); appendMessageToUI(msg, chatHistory.length - 1); saveAllData();
        document.getElementById('messageInput').value = ''; document.getElementById('sendBtn').disabled = true;
        scrollToBottom(); triggerTaReply(msg); resetAutoSendTimer();
    }

    function sendEmojiMsg(emoji) {
        document.getElementById('bottomPanel').classList.remove('active'); 
        var msg = { sender: 'user', type: 'image', content: emoji, text: '', time: Date.now() };
        if (currentQuoteMsg) { msg.quote = JSON.parse(JSON.stringify(currentQuoteMsg)); cancelQuote(); }
        chatHistory.push(msg); appendMessageToUI(msg, chatHistory.length - 1); saveAllData();
        scrollToBottom(); triggerTaReply(msg); resetAutoSendTimer(); 
    }

    function toggleToolPanel() {
        var panel = document.getElementById('bottomPanel');
        if(panel.classList.contains('active')) panel.classList.remove('active');
        else { panel.classList.add('active'); scrollToBottom(); renderEmojiPanel(); }
    }

    function switchTab(type) {
        document.getElementById('tabEmoji').classList.remove('active');
        document.getElementById('tabChoice').classList.remove('active');
        document.getElementById('emojiTabContent').classList.remove('active');
        document.getElementById('choiceTabContent').classList.remove('active');
        if (type === 'emoji') { document.getElementById('tabEmoji').classList.add('active'); document.getElementById('emojiTabContent').classList.add('active'); renderEmojiPanel(); }
        else { document.getElementById('tabChoice').classList.add('active'); document.getElementById('choiceTabContent').classList.add('active'); }
    }

    function cancelQuote() { currentQuoteMsg = null; document.getElementById('quotePreview').classList.remove('active'); }

    function closeActionMenu(e) { if (e.target.id === 'actionMenuOverlay') { document.getElementById('actionMenuOverlay').classList.remove('active'); currentActionMsgIndex = -1; } }

    function handleQuoteAction() {
        if (currentActionMsgIndex === -1) return;
        var msg = chatHistory[currentActionMsgIndex];
        if(!msg) return;
        var sender = msg.sender === 'user' ? currentSettings.userName : currentSettings.taName;
        currentQuoteMsg = { text: msg.type === 'image' ? '[图片表情]' : (msg.type === 'choice' ? '[问卷邀请]' : msg.text), type: msg.type, content: msg.content, senderName: sender };
        document.getElementById('quotePreviewText').innerText = sender + '：' + currentQuoteMsg.text;
        document.getElementById('quotePreview').classList.add('active');
        document.getElementById('actionMenuOverlay').classList.remove('active');
    }

    function handleDeleteAction() {
        if (currentActionMsgIndex === -1) return;
        if (confirm("确定要删除这条消息吗？")) { chatHistory.splice(currentActionMsgIndex, 1); saveAllData(); renderChatHistory(); scrollToBottom(); }
        document.getElementById('actionMenuOverlay').classList.remove('active'); currentActionMsgIndex = -1;
    }

    // 回复逻辑
    function triggerTaReply(userMsg) {
        document.getElementById('typingIndicator').innerText = currentSettings.taName + ' 正在输入...'; document.getElementById('typingIndicator').style.display = 'block'; scrollToBottom();
        var minMs = (currentSettings.minDelay || 1) * 1000, maxMs = (currentSettings.maxDelay || 3) * 1000;
        var delay = Math.floor(Math.random() * (Math.max(minMs, maxMs) - Math.min(minMs, maxMs) + 1)) + Math.min(minMs, maxMs);

        setTimeout(function() {
            document.getElementById('typingIndicator').style.display = 'none';
            var taMsg = { sender: 'ta', time: Date.now() };
            if (userMsg.type === 'choice' && userMsg.questions) {
                taMsg.type = 'text';
                var ans = [];
                for(var i=0; i<userMsg.questions.length; i++) { var q = userMsg.questions[i]; ans.push(q.options[Math.floor(Math.random() * q.options.length)]); }
                taMsg.text = '我选：' + ans.join('，');
            } else {
                var useImageEmoji = Math.random() < 0.2 && imageEmojis.length > 0;
                if (useImageEmoji) {
                    taMsg.type = 'image'; taMsg.content = imageEmojis[Math.floor(Math.random() * imageEmojis.length)]; taMsg.text = '';
                } else if (cards.length > 0) {
                    taMsg.type = 'text';
                    var replyText = cards[Math.floor(Math.random() * cards.length)];
                    if (currentSettings.mixEmoji && textEmojis.length > 0 && Math.random() < 0.2) replyText += ' ' + textEmojis[Math.floor(Math.random() * textEmojis.length)];
                    taMsg.text = replyText;
                } else if (imageEmojis.length > 0) {
                    taMsg.type = 'image'; taMsg.content = imageEmojis[Math.floor(Math.random() * imageEmojis.length)]; taMsg.text = '';
                } else { return; }

                if (Math.random() < 0.3) taMsg.quote = { text: userMsg.type === 'image' ? '[图片表情]' : (userMsg.text || ''), senderName: currentSettings.userName };
            }
            chatHistory.push(taMsg); appendMessageToUI(taMsg, chatHistory.length - 1); saveAllData(); scrollToBottom(); resetAutoSendTimer();
        }, delay);
    }

    function resetAutoSendTimer() {
        if (autoSendTimer) clearTimeout(autoSendTimer);
        if (!currentSettings.autoSendEnabled) return;
        var baseMs = (currentSettings.autoSendInterval || 2) * 60 * 1000;
        autoSendTimer = setTimeout(function() {
            if (!document.hidden) triggerAutoMessage();
            resetAutoSendTimer(); 
        }, Math.max(10000, baseMs + (Math.random() - 0.5) * 40000));    
    }

    function triggerAutoMessage() {
        document.getElementById('typingIndicator').innerText = currentSettings.taName + ' 正在输入...'; document.getElementById('typingIndicator').style.display = 'block'; scrollToBottom();
        setTimeout(function() {
            document.getElementById('typingIndicator').style.display = 'none';
            var taMsg = { sender: 'ta', time: Date.now() };
            if (currentSettings.patEnabled && patActions.length > 0 && Math.random() * 100 < currentSettings.patProbability) {
                taMsg.type = 'pat'; taMsg.content = patActions[Math.floor(Math.random() * patActions.length)];
            } else if (Math.random() < 0.3 && imageEmojis.length > 0) {
                taMsg.type = 'image'; taMsg.content = imageEmojis[Math.floor(Math.random() * imageEmojis.length)]; taMsg.text = '';
            } else if (cards.length > 0) {
                taMsg.type = 'text';
                var replyText = cards[Math.floor(Math.random() * cards.length)];
                if (currentSettings.mixEmoji && textEmojis.length > 0 && Math.random() < 0.3) replyText += ' ' + textEmojis[Math.floor(Math.random() * textEmojis.length)];
                taMsg.text = replyText;
            } else { return; }
            chatHistory.push(taMsg); appendMessageToUI(taMsg, chatHistory.length - 1); saveAllData(); scrollToBottom();
        }, 1500 + Math.random() * 1000);
    }

    // 问卷编辑器
    function openChoiceEditor() {
        document.getElementById('bottomPanel').classList.remove('active');
        editingChoiceData = { title: '测一测', questions: [{ q: '', options: ['', ''] }] };
        renderChoiceEditor();
        document.getElementById('choiceEditorModal').classList.add('active');
    }
    function closeChoiceEditor() { document.getElementById('choiceEditorModal').classList.remove('active'); }
    
    function renderChoiceEditor() {
        document.getElementById('ceTitle').value = editingChoiceData.title;
        var html = '';
        for(var i=0; i<editingChoiceData.questions.length; i++) {
            var q = editingChoiceData.questions[i];
            html += '<div style="background:#fff; padding:15px; border-radius:12px; margin-bottom:15px;">';
            html += '<input type="text" style="width:100%; border:none; border-bottom:1px solid #eee; padding:5px 0; font-weight:bold; margin-bottom:10px;" value="'+q.q+'" placeholder="输入问题..." oninput="updateChoiceQuestion('+i+', this.value)">';
            for(var j=0; j<q.options.length; j++) {
                html += '<div style="display:flex; margin-bottom:5px;"><span style="width:20px;">'+String.fromCharCode(65+j)+'</span><input type="text" style="flex:1; border:1px solid #eee; padding:5px; border-radius:4px;" value="'+q.options[j]+'" placeholder="选项内容" oninput="updateChoiceOption('+i+', '+j+', this.value)"></div>';
            }
            html += '<button style="background:none; border:none; color:#666; padding:10px 0;" onclick="addChoiceOption('+i+')">＋ 添加选项</button>';
            html += '</div>';
        }
        document.getElementById('ceQuestionList').innerHTML = html;
    }
    
    function updateChoiceQuestion(qIndex, val) { editingChoiceData.questions[qIndex].q = val; }
    function updateChoiceOption(qIndex, oIndex, val) { editingChoiceData.questions[qIndex].options[oIndex] = val; }
    function addChoiceOption(qIndex) { editingChoiceData.questions[qIndex].options.push(''); renderChoiceEditor(); }
    function addChoiceQuestion() { editingChoiceData.questions.push({ q: '', options: ['', ''] }); renderChoiceEditor(); }

    function submitChoice() {
        var title = document.getElementById('ceTitle').value.trim() || '测一测';
        var clean = [];
        for(var i=0; i<editingChoiceData.questions.length; i++) {
            var q = editingChoiceData.questions[i];
            var opts = [];
            for(var j=0; j<q.options.length; j++) { if(q.options[j].trim()) opts.push(q.options[j].trim()); }
            if(q.q.trim() && opts.length >= 2) clean.push({ q: q.q.trim(), options: opts });
        }
        if (clean.length === 0) { alert("请至少填写一道完整题目！"); return; }
        var msg = { sender: 'user', type: 'choice', title: title, questions: clean, text: '[问卷]', time: Date.now() };
        chatHistory.push(msg); appendMessageToUI(msg, chatHistory.length - 1); saveAllData();
        closeChoiceEditor(); scrollToBottom(); triggerTaReply(msg);
    }

    // 列表渲染
    function renderCards() {
        var list = document.getElementById('cardList');
        if(cards.length === 0) { list.innerHTML = '<div style="text-align:center; color:#999; font-size:14px; margin-top:20px;">暂无字卡</div>'; return; }
        var html = '';
        for(var i=cards.length-1; i>=0; i--) {
            html += '<div class="select-item"><input type="checkbox" data-index="'+i+'"><div class="select-item-content">'+cards[i]+'</div></div>';
        }
        list.innerHTML = html;    }

    function batchAddCards() {
        var textarea = document.getElementById('batchCardsInput');
        if(!textarea.value.trim()) return;
        var lines = textarea.value.split('\n');
        var added = 0;
        for(var i=0; i<lines.length; i++) {
            var t = lines[i].trim();
            if(t && cards.indexOf(t) === -1) { cards.push(t); added++; }
        }
        alert("成功导入 " + added + " 条！");
        saveAllData(); renderCards(); textarea.value = '';
    }

    function renderPatActions() {
        var list = document.getElementById('patActionList');
        if(patActions.length === 0) { list.innerHTML = '<div style="text-align:center; color:#999; font-size:14px; margin-top:20px;">暂无动作</div>'; return; }
        var html = '';
        for(var i=patActions.length-1; i>=0; i--) {
            html += '<div class="select-item"><input type="checkbox" data-index="'+i+'"><div class="select-item-content">✦ '+patActions[i]+'</div></div>';
        }
        list.innerHTML = html;
    }

    function batchAddPatActions() {
        var textarea = document.getElementById('batchPatActionsInput');
        if(!textarea.value.trim()) return;
        var lines = textarea.value.split('\n');
        var added = 0;
        for(var i=0; i<lines.length; i++) {
            var t = lines[i].trim();
            if(t && patActions.indexOf(t) === -1) { patActions.push(t); added++; }
        }
        alert("成功导入 " + added + " 个动作！");
        saveAllData(); renderPatActions(); textarea.value = '';
    }

    function renderEmojiSettings() {
        var list = document.getElementById('emojiImageSettingsList');
        if(imageEmojis.length === 0) { list.innerHTML = '<div style="text-align:center; color:#999; font-size:14px; margin-top:20px;">暂无图片表情</div>'; return; }
        var html = '';
        for(var i=imageEmojis.length-1; i>=0; i--) {
            html += '<div class="select-item"><input type="checkbox" data-index="'+i+'"><div class="select-item-content"><img src="'+imageEmojis[i]+'"></div></div>';
        }
        list.innerHTML = html;
    }

    function renderEmojiPanel() {
        var grid = document.getElementById('emojiPanelContent');
        if(imageEmojis.length === 0) { grid.innerHTML = '<div style="text-align:center; color:#999; font-size:14px; margin-top:20px;">暂无表情包，去设置添加吧</div>'; return; }
        var html = '';
        for(var i=0; i<imageEmojis.length; i++) {
            html += '<button class="emoji-image-item" onclick="sendEmojiMsg(\''+imageEmojis[i]+'\')"><img src="'+imageEmojis[i]+'"></button>';
        }
        grid.innerHTML = html;
    }

    // 批量删除
    function toggleSelectAll(listId, btnId) {
        var list = document.getElementById(listId);
        var btn = document.getElementById(btnId);
        var checkboxes = list.querySelectorAll('input[type="checkbox"]');
        if(!checkboxes.length) return;
        var allChecked = true;
        for(var i=0; i<checkboxes.length; i++) { if(!checkboxes[i].checked) allChecked = false; }
        for(var i=0; i<checkboxes.length; i++) { checkboxes[i].checked = !allChecked; }
        btn.style.color = !allChecked ? '#d4a373' : '#666';
    }

    function batchDelete(listId, dataArrayName) {
        var list = document.getElementById(listId);
        var checkboxes = list.querySelectorAll('input[type="checkbox"]:checked');
        if (checkboxes.length === 0) { alert("请先勾选要删除的项！"); return; }
        if (confirm("确定要删除选中的 " + checkboxes.length + " 项吗？")) {
            var indices = [];
            for(var i=0; i<checkboxes.length; i++) { indices.push(parseInt(checkboxes[i].getAttribute('data-index'))); }
            indices.sort(function(a,b){ return b-a; });
            
            var arr = window[dataArrayName];
            for(var i=0; i<indices.length; i++) { arr.splice(indices[i], 1); }
            
            saveAllData();
            if (dataArrayName === 'cards') renderCards();
            if (dataArrayName === 'patActions') renderPatActions();
            if (dataArrayName === 'imageEmojis') renderEmojiSettings();
        }
    }

    // --- 数据管理功能 ---
    function exportData() {
        try {
            var exportObj = {
                exportDate: new Date().toISOString(),
                customReplies: cards,
                customPokes: patActions,
                textEmojis: textEmojis,
                imageEmojis: imageEmojis,
                chatHistory: chatHistory,
                currentSettings: currentSettings
            };
            var dataStr = JSON.stringify(exportObj, null, 2);
            var blob = new Blob([dataStr], {type: "application/json"});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = '聊天数据备份_' + new Date().toLocaleDateString().replace(/\//g, '-') + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert("文件下载已开始！请到手机文件夹中查看。");
        } catch(e) {
            alert("导出失败，请检查浏览器是否拦截了下载：" + e.message);
        }
    }

    function doImport(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(event) {
            try {
                var data = JSON.parse(event.target.result);
                var importedCards = data.cards || data.customReplies || data.replies || [];
                var importedPats = data.patActions || data.customPokes || data.pokes || [];
                var importedTextEmojis = data.textEmojis || data.customEmojis || data.emojis || [];
                var importedImageEmojis = data.imageEmojis || [];
                var importedHistory = data.chatHistory || [];
                var importedSettings = data.currentSettings || data.settings;

                localStorage.setItem('ta_cards', JSON.stringify(importedCards));
                localStorage.setItem('pat_actions', JSON.stringify(importedPats));
                localStorage.setItem('text_emojis', JSON.stringify(importedTextEmojis));
                localStorage.setItem('image_emojis', JSON.stringify(importedImageEmojis));
                localStorage.setItem('chat_history', JSON.stringify(importedHistory));
                
                if (importedSettings) {
                    localStorage.setItem('chat_settings', JSON.stringify(importedSettings));
                }

                alert("数据导入成功！即将刷新页面。");
                location.reload();
            } catch(err) {
                alert("解析文件失败，请确保这是正确的备份文件！\n" + err.message);
            }
        };
        reader.readAsText(file);
    }

    function clearChatOnly() {
        if(confirm("确定要清空本会话的所有聊天记录吗？（字卡、表情包等设置会保留）")) {
            chatHistory = [];
            localStorage.setItem('chat_history', JSON.stringify([]));
            renderChatHistory();
            alert("会话已清空！");
        }
    }

    function clearAllData() {
        if(confirm("警告：这将清空所有聊天记录、字卡、表情包和设置，且无法恢复！确定要继续吗？")) {
            localStorage.clear();
            alert("数据已清空，即将刷新。");
            location.reload();
        }
    }

    // 存储与图片
    function saveAllData() {
        try {
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));
            localStorage.setItem('ta_cards', JSON.stringify(cards));
            localStorage.setItem('text_emojis', JSON.stringify(textEmojis));
            localStorage.setItem('image_emojis', JSON.stringify(imageEmojis));
            localStorage.setItem('pat_actions', JSON.stringify(patActions));
            localStorage.setItem('chat_settings', JSON.stringify(currentSettings));
        } catch (e) { alert("存储空间已满，请清理！"); }
    }

    function handleImgUpload(e, type) {
        if (e.target.files && e.target.files[0]) {
            compressImage(e.target.files[0], type === 'bg' ? 800 : 200, type === 'bg' ? 1200 : 200, 0.8, function(base64) {
                if (type === 'bg') {
                    currentSettings.chatBg = base64;
                    document.getElementById('bgImg').src = base64; document.getElementById('bgImg').style.display = 'block'; document.getElementById('bgText').style.display = 'none';
                    applySettings();
                } else if (type === 'ta') {
                    currentSettings.taAvatar = base64;
                    document.getElementById('taAvatarImg').src = base64; document.getElementById('taAvatarImg').style.display = 'block'; document.getElementById('taAvatarText').style.display = 'none';
                    renderChatHistory();
                } else if (type === 'user') {
                    currentSettings.userAvatar = base64;
                    document.getElementById('userAvatarImg').src = base64; document.getElementById('userAvatarImg').style.display = 'block'; document.getElementById('userAvatarText').style.display = 'none';
                    renderChatHistory();
                }
                saveAllData();
            });
        }
    }

    function handleEmojiUpload(e) {
        var files = e.target.files;
        if (!files || files.length === 0) return;
        var processed = 0;
        for (var i = 0; i < files.length; i++) {
            (function(file) {
                compressImage(file, 300, 300, 0.85, function(base64) {
                    imageEmojis.push(base64); processed++;
                    if (processed === files.length) { saveAllData(); renderEmojiSettings(); e.target.value = ''; alert('成功添加 ' + processed + ' 个表情！'); }
                });
            })(files[i]);
        }
    }

    function compressImage(file, maxW, maxH, quality, cb) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                var w = img.width, h = img.height;
                if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                if (h > maxH) { w = Math.round((w * maxH) / h); h = maxH; }
                var c = document.createElement('canvas');
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                cb(c.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>
